<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>latent — a quiet corner of the internet</title>
<meta name="description" content="Personal landing page of latent. Nothing much here, on purpose.">
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf8f4;
    color: #2b2620;
    padding: 2rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17150f; color: #e8e2d4; }
    .card { border-color: #3a352a !important; }
    .sub, footer { color: #9a917e !important; }
  }
  .card {
    max-width: 560px;
    border: 1px solid #ddd5c3;
    border-radius: 12px;
    padding: 3rem 2.5rem;
    text-align: center;
  }
  h1 { font-size: 2.6rem; font-weight: normal; letter-spacing: .04em; }
  .sub { color: #8a8071; margin-top: .6rem; font-style: italic; }
  p.body { margin-top: 1.6rem; line-height: 1.75; font-size: 1.02rem; }
  footer { margin-top: 2.4rem; font-size: .8rem; color: #a89d88; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
  <main class="card">
    <h1>latent</h1>
    <p class="sub">present, but not yet visible</p>
    <p class="body">
      This is a small personal landing page — a placeholder kept warm on purpose.
      Most of what matters happens elsewhere; this corner simply exists, quietly,
      like potential waiting for its moment.
    </p>
    <footer>latent.loc.cc · est. 2026</footer>
  </main>
</body>
</html>
